<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rinku ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  font-family:'Poppins',sans-serif;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1e1e2f,#0f0f1a);
  color:white;
}

/* Star background */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background-image:radial-gradient(white 1px,transparent 1px);
  background-size:40px 40px;
  opacity:.15;
  animation:stars 60s linear infinite;
}

@keyframes stars{
  from{transform:translate(0,0);}
  to{transform:translate(-500px,-500px);}
}

/* Envelope */
.envelope{
  position:relative;
  width:320px;
  height:200px;
  background:#ff4d6d;
  border-radius:10px;
  cursor:pointer;
  transition:1s;
}

.envelope:before{
  content:"";
  position:absolute;
  border-left:160px solid transparent;
  border-right:160px solid transparent;
  border-bottom:100px solid #ff758f;
  top:0;
  transform-origin:top;
  transition:1s;
}

.open .envelope:before{
  transform:rotateX(180deg);
}

/* Letter */
.letter{
  position:absolute;
  width:90%;
  max-width:350px;
  background:#fffaf0;
  color:#333;
  padding:25px;
  border-radius:15px;
  box-shadow:0 20px 40px rgba(0,0,0,.4);
  text-align:center;
  transform:translateY(150%);
  opacity:0;
  transition:1.2s ease;
}

.open .letter{
  transform:translateY(0);
  opacity:1;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:2.3rem;
  color:#d6336c;
  margin-bottom:10px;
}

.typing{
  min-height:50px;
  font-size:1.1rem;
  margin-bottom:15px;
}

.message{
  font-size:.9rem;
  margin-bottom:15px;
}

/* Photo */
.photo{
  width:100%;
  border-radius:10px;
  margin-bottom:15px;
  display:none;
}

/* Buttons */
button{
  padding:10px 18px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin:5px;
  font-size:.9rem;
  transition:.3s;
}

.yes{
  background:#ff4d6d;
  color:white;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,77,109,.7);}
  70%{box-shadow:0 0 0 15px rgba(255,77,109,0);}
  100%{box-shadow:0 0 0 0 rgba(255,77,109,0);}
}

.no{
  background:white;
  color:#ff4d6d;
  position:absolute;
}

/* Floating hearts */
.heart{
  position:absolute;
  font-size:22px;
  animation:float 6s linear infinite;
  opacity:.8;
}

@keyframes float{
  0%{transform:translateY(100vh) scale(1);}
  100%{transform:translateY(-10vh) scale(1.5);}
}

/* Confetti */
.confetti{
  position:absolute;
  width:8px;
  height:8px;
  background:hsl(calc(360 * var(--i)),100%,60%);
  top:50%;
  left:50%;
  animation:confetti 2s ease-out forwards;
}

@keyframes confetti{
  to{
    transform:translate(calc(200px - 400px * random()), calc(200px - 400px * random()));
    opacity:0;
  }
}

.celebrate{
  font-family:'Great Vibes',cursive;
  font-size:2.8rem;
  color:#ff4d6d;
  animation:glow 1s infinite alternate;
}

@keyframes glow{
  from{text-shadow:0 0 10px #ff4d6d;}
  to{text-shadow:0 0 25px #ff85a1;}
}

@media(max-width:480px){
  .envelope{width:260px;}
}
</style>
</head>

<body>

<audio id="music" loop>
  <!-- Replace with your own mp3 file -->
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="main">
  <div class="envelope" onclick="openLetter()"></div>
  <div class="letter">
      <h1>My Dearest 💌</h1>

      <div class="typing" id="typingText"></div>

      <!-- Add your image file name here -->
      <img src="yourphoto.jpg" class="photo" id="photo">

      <div class="message">
          From the moment you came into my life,  
          everything feels magical and complete.  
          Will you be my Valentine? ❤️
      </div>

      <button class="yes" onclick="sayYes()">Yes Yaani 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
  </div>
</div>

<script>
function openLetter(){
  document.getElementById("main").classList.add("open");
  document.getElementById("music").play();
  typeEffect();
  setTimeout(()=>{document.getElementById("photo").style.display="block";},2000);
}

/* Typing effect */
const text="Rinku... my Yaani 💕";
let i=0;
function typeEffect(){
  if(i<text.length){
    document.getElementById("typingText").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeEffect,70);
  }
}

/* No button escapes */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
  noBtn.style.left=Math.random()*250+"px";
  noBtn.style.top=Math.random()*150+"px";
});

/* Yes celebration */
function sayYes(){
  document.body.innerHTML=`<div class="celebrate">She Said YES!!! 💕</div>`;
  createHearts(60);
  createConfetti(80);
  createFireworks();
}


/* Hearts */
function createHearts(n){
  for(let i=0;i<n;i++){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);
  }
}

/* Confetti */
function createConfetti(n){
  for(let i=0;i<n;i++){
    const conf=document.createElement("div");
    conf.classList.add("confetti");
    conf.style.setProperty('--i',Math.random());
    conf.style.left=Math.random()*100+"vw";
    conf.style.top=Math.random()*100+"vh";
    document.body.appendChild(conf);
  }
}

/* Fireworks */
function createFireworks() {
  for (let i = 0; i < 25; i++) {
    let fire = document.createElement("div");
    fire.style.position = "absolute";
    fire.style.width = "6px";
    fire.style.height = "6px";
    fire.style.borderRadius = "50%";
    fire.style.background = `hsl(${Math.random()*360},100%,60%)`;
    fire.style.left = "50%";
    fire.style.top = "50%";
    fire.style.transition = "1s ease-out";
    document.body.appendChild(fire);

    setTimeout(()=>{
      fire.style.transform = `translate(${Math.random()*400-200}px, ${Math.random()*400-200}px)`;
      fire.style.opacity = "0";
    },10);

    setTimeout(()=> fire.remove(),1000);
  }
}

</script>

</body>
</html>
