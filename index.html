<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rinku ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}
body{
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#141428,#000);
  color:white;
  overflow-x:hidden;
  animation:bgGlow 6s infinite alternate;
}

@keyframes bgGlow{
  from{background:radial-gradient(circle at top,#141428,#000);}
  to{background:radial-gradient(circle at top,#1f1f3a,#000);}
}

/* Stars */
.stars{
  position:fixed;
  width:200%;
  height:200%;
  background-image:radial-gradient(white 1px,transparent 1px);
  background-size:40px 40px;
  opacity:.15;
  z-index:-1;
}

/* Shooting stars */
.shooting{
  position:absolute;
  width:2px;
  height:80px;
  background:linear-gradient(white,transparent);
  animation:shoot 5s linear infinite;
  opacity:.6;
}
@keyframes shoot{
  0%{transform:translate(-200px,-200px) rotate(45deg);}
  100%{transform:translate(1200px,800px) rotate(45deg);}
}

#main{
  width:100%;
  padding:120px 20px;
  display:flex;
  justify-content:center;
  position:relative;
}

/* Envelope */
.envelope{
  width:320px;
  height:200px;
  background:#ff4d6d;
  border-radius:10px;
  cursor:pointer;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
.envelope:before{
  content:"";
  position:absolute;
  border-left:160px solid transparent;
  border-right:160px solid transparent;
  border-bottom:100px solid #ff758f;
  top:0;
  transform-origin:top;
  transition:1s;
}
.open .envelope:before{transform:rotateX(180deg);}

/* Letter */
.letter{
  position:absolute;
  width:95%;
  max-width:380px;
  background:#fffaf0;
  color:#333;
  padding:30px;
  border-radius:15px;
  text-align:center;
  transform:translateY(150%) scale(.9);
  opacity:0;
  transition:1.3s ease;
}
.open .letter{
  transform:translateY(0) scale(1);
  opacity:1;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:2.5rem;
  color:#d6336c;
}

.typing{margin:15px 0;min-height:50px;}

.photo{
  width:100%;
  border-radius:12px;
  margin:15px 0;
  display:none;
  transform:scale(.8);
  transition:1s ease;
}
.photo.show{display:block;transform:scale(1);}

.section{
  margin:20px 0;
  opacity:0;
  transform:translateY(30px);
  transition:1s ease;
}
.section.visible{opacity:1;transform:translateY(0);}

button{
  padding:10px 18px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin:5px;
}
.yes{background:#ff4d6d;color:white;}
.no{background:white;color:#ff4d6d;position:absolute;}

.final{
  margin-top:150px;
  text-align:center;
  font-family:'Great Vibes',cursive;
  font-size:3.5rem;
  color:#ff4d6d;
  animation:glow 1s infinite alternate;
}
@keyframes glow{
  from{text-shadow:0 0 10px #ff4d6d;}
  to{text-shadow:0 0 40px #ff85a1;}
}

.heart{
  position:absolute;
  font-size:22px;
  animation:rise 6s linear infinite;
}
@keyframes rise{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

.secret{
  position:fixed;
  bottom:20px;
  right:20px;
  background:white;
  color:#d6336c;
  padding:10px 15px;
  border-radius:20px;
  display:none;
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="shooting" style="top:20%;left:10%;"></div>
<div class="shooting" style="top:50%;left:60%;animation-delay:2s;"></div>

<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="main">
  <div class="envelope" onclick="openLetter()"></div>

  <div class="letter" id="letter">
    <h1>My Dearest 💌</h1>
    <div class="typing" id="typingText"></div>

    <img src="yourphoto.jpg" class="photo" id="photo">

    <div class="section">You are my happiness.</div>
    <div class="section">You are my peace.</div>
    <div class="section">You are my forever.</div>

    <button class="yes" onclick="sayYes()">Yes Yaani 💖</button>
    <button class="no" id="noBtn">No 🙈</button>
  </div>
</div>

<div class="secret" id="secretBox">I love you more than words can say 💌</div>

<script>

/* Scroll fade */
const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){entry.target.classList.add("visible");}
  });
});
document.querySelectorAll(".section").forEach(el=>observer.observe(el));

/* Typing */
const text="Rinku... my Yaani 💕";
let i=0;
function typeEffect(){
  if(i<text.length){
    document.getElementById("typingText").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeEffect,70);
  }
}

function openLetter(){
  document.getElementById("main").classList.add("open");
  typeEffect();
  setTimeout(()=>document.getElementById("photo").classList.add("show"),2000);
}

/* No button escape */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
  noBtn.style.left=Math.random()*250+"px";
  noBtn.style.top=Math.random()*150+"px";
});

/* YES */
function sayYes(){
  document.body.innerHTML=`<div class="final">I Love You Yaani ❤️</div>`;
  document.getElementById("bgMusic").play();
  createHearts(80);
  createFireworks();
}

/* Hearts */
function createHearts(n){
  for(let i=0;i<n;i++){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);
  }
}

/* Fireworks */
function createFireworks(){
  for(let i=0;i<40;i++){
    let f=document.createElement("div");
    f.style.position="absolute";
    f.style.width="6px";
    f.style.height="6px";
    f.style.borderRadius="50%";
    f.style.background=`hsl(${Math.random()*360},100%,60%)`;
    f.style.left="50%";
    f.style.top="50%";
    f.style.transition="1s ease-out";
    document.body.appendChild(f);
    setTimeout(()=>{
      f.style.transform=`translate(${Math.random()*500-250}px,${Math.random()*500-250}px)`;
      f.style.opacity="0";
    },10);
  }
}

/* Secret tap */
let tapCount=0;
document.body.addEventListener("click",()=>{
  tapCount++;
  if(tapCount===3){
    document.getElementById("secretBox").style.display="block";
  }
});
</script>

</body>
</html>
