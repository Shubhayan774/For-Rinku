<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Rinku ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;scroll-behavior:smooth;}

body{
  min-height:100vh;
  font-family:'Poppins',sans-serif;
  background:radial-gradient(circle at top,#1e1e2f,#0f0f1a);
  color:white;
  overflow-x:hidden;
}

/* PARALLAX STARS */
.stars{
  position:fixed;
  width:200%;
  height:200%;
  background-image:radial-gradient(white 1px,transparent 1px);
  background-size:40px 40px;
  opacity:.15;
  z-index:-1;
  transition:transform .2s ease-out;
}

#main{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:80px 20px;
  position:relative;
}

/* Floating envelope animation */
.envelope{
  position:relative;
  width:320px;
  height:200px;
  background:#ff4d6d;
  border-radius:10px;
  cursor:pointer;
  animation:floatEnvelope 3s ease-in-out infinite;
}

@keyframes floatEnvelope{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}

.envelope:before{
  content:"";
  position:absolute;
  border-left:160px solid transparent;
  border-right:160px solid transparent;
  border-bottom:100px solid #ff758f;
  top:0;
  transform-origin:top;
  transition:1s;
}

.open .envelope:before{
  transform:rotateX(180deg);
}

/* LETTER */
.letter{
  position:absolute;
  width:95%;
  max-width:380px;
  background:#fffaf0;
  color:#333;
  padding:30px;
  border-radius:15px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
  text-align:center;
  transform:translateY(150%) scale(.9);
  opacity:0;
  transition:1.3s ease;
}

.open .letter{
  transform:translateY(0) scale(1);
  opacity:1;
}

h1{
  font-family:'Great Vibes',cursive;
  font-size:2.4rem;
  color:#d6336c;
  margin-bottom:10px;
}

.typing{
  min-height:50px;
  font-size:1.1rem;
  margin-bottom:15px;
}

/* Scroll fade */
.fade-in{
  opacity:0;
  transform:translateY(30px);
  transition:1s ease;
}

.fade-in.visible{
  opacity:1;
  transform:translateY(0);
}

/* Photo */
.photo{
  width:100%;
  border-radius:12px;
  margin:15px 0;
  display:none;
  transform:scale(.8);
  transition:1s ease;
}

.photo.show{
  display:block;
  transform:scale(1);
}

/* Buttons */
button{
  padding:10px 18px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin:5px;
  font-size:.9rem;
  transition:.3s;
}

.yes{
  background:#ff4d6d;
  color:white;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,77,109,.7);}
  70%{box-shadow:0 0 0 15px rgba(255,77,109,0);}
  100%{box-shadow:0 0 0 0 rgba(255,77,109,0);}
}

.no{
  background:white;
  color:#ff4d6d;
  position:absolute;
}

/* Hearts */
.heart{
  position:absolute;
  font-size:22px;
  animation:float 6s linear infinite;
}

@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}

.celebrate{
  font-family:'Great Vibes',cursive;
  font-size:3rem;
  color:#ff4d6d;
  animation:glow 1s infinite alternate;
}

@keyframes glow{
  from{text-shadow:0 0 10px #ff4d6d;}
  to{text-shadow:0 0 30px #ff85a1;}
}

@media(max-width:480px){
  .envelope{width:260px;}
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="main">
  <div class="envelope" onclick="openLetter()"></div>

  <div class="letter fade-in" id="letter">
      <h1>My Dearest 💌</h1>
      <div class="typing" id="typingText"></div>

      <img src="yourphoto.jpg" class="photo" id="photo">

      <div class="fade-in">
          From the moment you came into my life,  
          everything feels magical and complete.  
          You are my happiness, my peace, my favorite person.  
      </div>

      <br>

      <button class="yes" onclick="sayYes()">Yes Yaani 💖</button>
      <button class="no" id="noBtn">No 🙈</button>
  </div>
</div>

<script>
/* Parallax stars */
window.addEventListener("scroll",()=>{
  document.getElementById("stars").style.transform=
    "translateY("+window.scrollY*0.3+"px)";
});

/* Fade-in on scroll */
const observer=new IntersectionObserver(entries=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add("visible");
    }
  });
});
document.querySelectorAll(".fade-in").forEach(el=>{
  observer.observe(el);
});

/* Open letter */
function openLetter(){
  document.getElementById("main").classList.add("open");
  document.getElementById("music").play();
  typeEffect();
  setTimeout(()=>{
    document.getElementById("photo").classList.add("show");
  },2000);
}

/* Typing */
const text="Rinku... my Yaani 💕";
let i=0;
function typeEffect(){
  if(i<text.length){
    document.getElementById("typingText").innerHTML+=text.charAt(i);
    i++;
    setTimeout(typeEffect,70);
  }
}

/* No button escape */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
  noBtn.style.left=Math.random()*250+"px";
  noBtn.style.top=Math.random()*150+"px";
});

/* YES effects */
function sayYes(){
  document.body.innerHTML=`<div class="celebrate">She Said YES!!! 💕</div>`;
  createHearts(60);
  createConfetti(80);
  createFireworks();
}

/* Hearts */
function createHearts(n){
  for(let i=0;i<n;i++){
    const heart=document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);
  }
}

/* Confetti */
function createConfetti(n){
  for(let i=0;i<n;i++){
    let c=document.createElement("div");
    c.style.position="absolute";
    c.style.width="8px";
    c.style.height="8px";
    c.style.background=`hsl(${Math.random()*360},100%,60%)`;
    c.style.left=Math.random()*100+"vw";
    c.style.top=Math.random()*100+"vh";
    c.style.opacity="1";
    c.style.transition="1s";
    document.body.appendChild(c);
    setTimeout(()=>{
      c.style.transform=`translate(${Math.random()*400-200}px,${Math.random()*400-200}px)`;
      c.style.opacity="0";
    },10);
  }
}

/* Fireworks */
function createFireworks(){
  for(let i=0;i<30;i++){
    let f=document.createElement("div");
    f.style.position="absolute";
    f.style.width="6px";
    f.style.height="6px";
    f.style.borderRadius="50%";
    f.style.background=`hsl(${Math.random()*360},100%,60%)`;
    f.style.left="50%";
    f.style.top="50%";
    f.style.transition="1s ease-out";
    document.body.appendChild(f);
    setTimeout(()=>{
      f.style.transform=`translate(${Math.random()*500-250}px,${Math.random()*500-250}px)`;
      f.style.opacity="0";
    },10);
  }
}
</script>

</body>
</html>
